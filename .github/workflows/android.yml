
name: Build SMOOTH SENSI AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q SMOOTH_SENSI_AI_GitHub_Build.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SMOOTH-SENSI-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
